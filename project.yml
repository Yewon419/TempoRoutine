# XcodeGen 프로젝트 정의 — .xcodeproj는 생성물(.gitignore), 이 파일이 소스 (MASTER §5.10)
name: TempoRoutine
options:
  bundleIdPrefix: app.temporoutine
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  # 원본 언어 = 한국어(2026-08-20 로컬라이제이션 개시). 화면 문자열의 키가 한글 리터럴이라
  # 원본 언어를 ko로 선언해야 폴백이 한국어로 떨어진다. en·ja는 String Catalog의 로케일에서
  # XcodeGen이 자동으로 knownRegions에 넣는다(StringCatalogDecoding.swift 실측 — 별도 설정 불요).
  developmentLanguage: ko

packages:
  TempoCore:
    path: TempoCore

targets:
  TempoRoutine:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - App
      - Shared          # 앱 ↔ 위젯 공용(스냅샷 계약)
    dependencies:
      - package: TempoCore
      - target: TempoWidgets   # 위젯 익스텐션 임베드(2026-07-27)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.temporoutine.TempoRoutine
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"        # 아이폰 + 아이패드 (§5.10 — CloudKit 동기화 시점에 iPad 동시 추가, 2026-07-23)
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 템포루틴
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIBackgroundModes: remote-notification   # CloudKit 변경 푸시 수신(동기화)
        INFOPLIST_KEY_NSSupportsLiveActivities: YES   # 타이머·스톱워치 잠금화면(2026-08-09)
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO  # 자체 암호화 없음 — 수출 규정 질문 생략(ASC 실측)
        # 구입 내역(2026-09-04) — 소모품(커피 한 잔)은 finish 하면 StoreKit 이력에서 지워지는 게
        # 기본값이라, 이 키 없이는 설정 > 구입 내역에 커피가 한 줄도 안 뜬다(iOS 18+ 옵트인).
        INFOPLIST_KEY_SKIncludeConsumableInAppPurchaseHistory: YES
        # EventKit 읽기(§3.6.1) — iOS 17+ 풀 액세스 필요, 의도는 fetch만
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 기존 캘린더의 약속과 생일을 화면에 비추기 위해서만 읽어요. 기록이 밖으로 나가지 않아요.
        # HealthKit read-write 미러(§5.7) — 로컬이 단일 출처, Health는 미러
        CODE_SIGN_ENTITLEMENTS: TempoRoutine.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: 건강 앱에 기록된 생리 기록을 불러와 계절 계산에 반영해요. 기록이 밖으로 나가지 않아요.
        # 날씨 테마(§5.5) — 대략적 위치만: 하늘 지면에 쓸 동네 날씨를 가져오는 용도
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 날씨 테마의 하늘을 지금 계신 곳의 날씨로 맞추기 위해서만 써요. 대략적인 위치면 충분하고, 위치가 밖으로 나가지 않아요.
        # 기본을 대략적 정확도로 — 날씨엔 시 단위면 충분(프라이버시 최소 수집)
        INFOPLIST_KEY_NSLocationDefaultAccuracyReduced: YES
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 이 앱에서 남긴 생리 기록을 건강 앱에도 저장해요. 원할 때 끌 수 있어요.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4VD7XCCBQN

  # 위젯 익스텐션 (Phase 1: 오늘의 계절 — 2026-07-27, MASTER §8.2.8)
  TempoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Widgets
      - Shared
      - path: App/Fonts   # Gowun Batang 번들(위젯 프로세스도 런타임 등록 필요, 2026-07-27)
        excludes:         # 활판·플리 서체는 앱 전용(2026-08-18·08-30·08-31) — 위젯 미대응, 이중 탑재 금지
          - "NotoSerifKR-Variable.ttf"
          - "BodoniModa-Variable.ttf"
          - "Raleway-Variable.ttf"
          - "Geist-Regular.otf"
          - "Geist-Medium.otf"
          - "Geist-SemiBold.otf"
          - "GmarketSansLight.otf"
          - "GmarketSansMedium.otf"
          - "IBMPlexSansKR-Regular.ttf"
          - "IBMPlexSansKR-Medium.ttf"
          - "GowunDodum-Regular.ttf"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: 템포루틴
        # 명시 info: 블록은 버전 키를 리터럴(1/1.0)로 박는다 — 빌드 설정 변수로 연결해야
        # 앱과 버전 일치(ITMS-90473 실측 2026-07-28: appex 1/1.0 vs 앱 195/0.1.0 경고)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.temporoutine.TempoRoutine.widgets
        MARKETING_VERSION: 0.1.0           # 앱과 동일해야 업로드 통과(appex 버전 일치 요건)
        CURRENT_PROJECT_VERSION: 1         # CI가 run number로 덮음(전 타깃 공통)
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widgets/TempoWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4VD7XCCBQN
