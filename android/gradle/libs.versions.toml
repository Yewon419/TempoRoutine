# 버전 실측 2026-09-04 (Phase 0): AGP 9.4.0 / Gradle 9.6.0 / Kotlin 2.4.10 / Compose BOM 2026.08.00.
# AGP 9는 Kotlin 내장 — kotlin-android 플러그인은 적용하지 않는다(JetBrains 2026-01 마이그레이션 안내).
# Phase 1 추가: KSP 2.3.11(Kotlin과 독립 버저닝) / Room 2.8.4 / DataStore 1.2.1 / Haze 1.7.3 / lifecycle 2.11.0.
[versions]
agp = "9.4.0"
kotlin = "2.4.10"
ksp = "2.3.11"
serialization = "1.11.0"
composeBom = "2026.08.00"
activityCompose = "1.13.0"
coreKtx = "1.17.0"
lifecycle = "2.11.0"
room = "2.8.4"
datastore = "1.2.1"
