# 템포루틴 CI (MASTER §5.10)
# 잡 1: TempoCore swift test — 순수 Foundation이라 Linux 러너(공식 Swift 컨테이너)로 분 단위 실행.
# 잡 2(앱 빌드·TestFlight)는 빌드 2에서 활성화 — macOS 러너 이미지·Xcode 버전은 그 시점에 실측(§5.10 추측 금지).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # TestFlight 업로드 = 수동 전용 (배포는 몰아서 — ASC 일일 한도 대응)

jobs:
  tempocore-tests:
    name: TempoCore swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build & test
        run: swift test --package-path TempoCore

  app-build:
    name: App build (macOS, unsigned simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 실측 — Xcode·SDK (§5.10 추측 금지)
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          xcodebuild -showsdks | grep -i ios || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TempoRoutine.xcodeproj \
            -scheme TempoRoutine \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO

      # ── 로컬라이제이션 실측 (2026-08-20, en·ja 이관) ────────────────────────────
      # ① 번들에 언어가 실제로 들어갔는지: String Catalog는 컴파일돼 <lang>.lproj로 떨어진다.
      #    빠져도 빌드는 그린이라(그냥 한국어로 뜬다) 여기서 세지 않으면 실기기 전까지 안 드러난다.
      - name: 실측 — 번들 로컬라이제이션
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name "TempoRoutine.app" | head -1)
          echo "APP=$APP"
          find "$APP" -maxdepth 2 -name "*.lproj" -exec basename {} \; | sort
      # ── 구입 내역 실측 (2026-09-04) ─────────────────────────────────────────────
      # 소모품(커피) 이력 옵트인 키가 생성 Info.plist에 **불리언으로** 들어갔는지 본다.
      # INFOPLIST_KEY_ 경로는 Xcode가 타입을 아는 키만 불리언으로 쓰고 모르는 키는 문자열로
      # 떨어질 수 있다 — 문자열이면 StoreKit이 플래그를 못 읽어 커피 결제가 이력에서 조용히
      # 빠진다(빌드는 그린). `=> 1`이면 불리언, `=> "YES"`면 문자열이라 다른 경로가 필요하다.
      # 계측이지 게이트가 아니다(위 로컬라이제이션 실측과 같은 태도).
      - name: 실측 — 소모품 구입 이력 옵트인 키
        run: |
          APP=$(find build/dd/Build/Products -maxdepth 3 -name "TempoRoutine.app" | head -1)
          plutil -p "$APP/Info.plist" | grep -i "SKIncludeConsumable" || echo "⚠ 키가 Info.plist에 없음"
      # ② Xcode 공식 추출로 **런타임 키**를 뽑는다. Windows에선 추출을 못 돌려 카탈로그를
      #    손으로 쓰는데, 보간 문자열의 키(예: "\(n)일차" → "%lld일차")를 소스만 보고 단정할
      #    수 없다. 이 xliff가 그 정답지다 — 내려받아 카탈로그 키와 대조한다.
      - name: 실측 — 로컬라이즈 문자열 추출(xliff)
        run: |
          set -o pipefail
          # -derivedDataPath를 쓰면 -scheme이 필수다(2026-08-20 실측: "The flag -scheme ... is required")
          xcodebuild -exportLocalizations \
            -project TempoRoutine.xcodeproj \
            -scheme TempoRoutine \
            -localizationPath build/loc \
            -exportLanguage ko \
            -derivedDataPath build/dd || true
          # 추출이 실패해도 이 단계가 빌드를 죽이지 않게 — 계측이지 게이트가 아니다
          find build/loc -name "*.xliff" -exec sh -c 'echo "== $1"; grep -c "<trans-unit" "$1"' _ {} \; || true
          echo "추출 파일:"; ls -R build/loc 2>/dev/null | head -20 || true
      - name: Upload xliff
        uses: actions/upload-artifact@v4
        with:
          name: localizations
          path: build/loc
          if-no-files-found: warn
      # ── 찰칵: 시뮬레이터 스크린샷 (2026-09-04) ─────────────────────────────
      # 위에서 만든 무서명 .app을 시뮬레이터에 올려 탭별로 찍는다. TestFlight 없이 진짜 렌더링을
      # 아티팩트(screenshots)로 본다. 화면 이동은 런치 인자(argument 도메인)·defaults 주입뿐,
      # 앱 코드 무수정. 첫 실측이라 fail-on-crash 끔. 죽으면 summary.md에 「죽음」으로 남는다.
      - uses: Yewon419/chalkak@main
        with:
          app: build/dd/Build/Products/Debug-iphonesimulator/TempoRoutine.app
          # 무서명 .app은 entitlements가 비어 CKContainer 초기화에서 죽는다(2026-09-04 실측, PlannerSync.start).
          # TestFlight 잡의 ad-hoc 심기와 같은 처방을 찰칵이 설치 전에 한다.
          entitlements: TempoRoutine.entitlements
          defaults: |
            onboardingDone -bool true
          screens: |
            today    | -rootTab today
            calendar | -rootTab calendar
            rhythm   | -rootTab rhythm
            settings | -rootTab settings
          fail-on-crash: 'false'

  testflight:
    name: TestFlight upload (archive + cloud signing)
    needs: [tempocore-tests, app-build]
    # 수동 트리거만 — push마다 업로드하지 않는다(빌드는 몰아서, 2026-07-20 사용자 결정)
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Restore ASC API key
        run: |
          mkdir -p private_keys
          printf '%s' "${{ secrets.ASC_PRIVATE_KEY }}" > "private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive (cloud signing)
        run: |
          set -o pipefail
          # archive는 무서명 — 기기 미등록 팀에서 개발 프로파일 요구를 피한다.
          # 배포 서명은 export 단계의 cloud signing이 담당 (실측 이터레이션 1)
          xcodebuild archive \
            -project TempoRoutine.xcodeproj \
            -scheme TempoRoutine \
            -destination 'generic/platform=iOS' \
            -archivePath build/TempoRoutine.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER
      - name: 실측 — 아이패드 지원 확인 (UIDeviceFamily·방향)
        run: |
          # 폰모드(호환 모드) 진단용 — 2가 없으면 아이패드 네이티브가 아니다 (2026-07-23)
          plutil -p build/TempoRoutine.xcarchive/Products/Applications/TempoRoutine.app/Info.plist \
            | grep -E -A 4 "UIDeviceFamily|UISupportedInterfaceOrientations" || true
      - name: Embed entitlements (ad-hoc sign)
        run: |
          # 무서명 archive는 entitlements가 비어 export 재서명 IPA에서 HealthKit이 빠짐(실측: 빌드 20).
          # ad-hoc 서명으로 entitlements를 심으면 export가 이를 보존해 배포 서명에 반영한다.
          # 순서 = 안쪽부터: 중첩 appex를 먼저 서명해야 앱 서명이 그 위를 봉인한다(2026-07-27 위젯 추가).
          APPEX=build/TempoRoutine.xcarchive/Products/Applications/TempoRoutine.app/PlugIns/TempoWidgets.appex
          if [ -d "$APPEX" ]; then
            codesign --force --sign - \
              --entitlements Widgets/TempoWidgets.entitlements "$APPEX"
            codesign -d --entitlements - "$APPEX"
          fi
          codesign --force --sign - \
            --entitlements TempoRoutine.entitlements \
            build/TempoRoutine.xcarchive/Products/Applications/TempoRoutine.app
          codesign -d --entitlements - build/TempoRoutine.xcarchive/Products/Applications/TempoRoutine.app
      - name: Export & upload to TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/TempoRoutine.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Cleanup key
        if: always()
        run: rm -rf private_keys
